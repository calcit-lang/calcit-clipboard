on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          version: 0.29.0
          caps-version: 0.1.1

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --strict-types --check-only --all-defs
          calcit calcit.cirru docs format-md README.md --check

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev

      - run: cargo fmt --all -- --check

      - run: cargo build --release --locked

      - run: cargo test --locked

      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: mkdir -p dylibs/ && cp -v target/release/libclipboard.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate executable documentation
        run: |
          xvfb-run -a calcit calcit.cirru docs check-md README.md --failures-only
          xvfb-run -a calcit calcit.cirru docs check-md docs/system-clipboard.md --failures-only

      - run: xvfb-run -a calcit calcit.cirru
