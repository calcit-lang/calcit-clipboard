on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --strict-types --check-only
          calcit calcit.cirru analyze check-public --ns 'clipboard.$meta' --ns clipboard.core --ns clipboard.test --ns clipboard.util --format json
          calcit calcit.cirru analyze quality
          calcit calcit.cirru docs format-md README.md --check

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev xclip

      - run: cargo fmt --all -- --check

      - run: cargo build --release --locked

      - run: cargo test --locked

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: mkdir -p dylibs/ && cp -v target/release/libclipboard.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate executable documentation
        run: |
          xvfb-run -a calcit calcit.cirru docs check-md README.md --failures-only
          xvfb-run -a calcit calcit.cirru docs check-md docs/system-clipboard.md --failures-only

      - name: Run clipboard integration test
        env:
          CALCIT_CLIPBOARD_TEST: 1
        run: xvfb-run -a sh -c 'printf %s ci-original | xclip -selection clipboard && calcit calcit.cirru'
