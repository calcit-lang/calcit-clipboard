on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: 0.1.1

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          calcit calcit.cirru docs format-md README.md --check

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install clipboard system dependencies
        run: |
          reachable=0
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if getent ahostsv4 "$host" >/dev/null; then
              reachable=$((reachable + 1))
            fi
          done
          if [ "$reachable" -lt 3 ] && [ -f /etc/apt/apt-mirrors.txt ]; then
            priority=4
            # Avoid per-package DNS retries when all three default mirrors are down.
            if [ "$reachable" -eq 0 ]; then priority=0; fi
            echo "Ubuntu mirror DNS failed; adding the Kernel.org mirror."
            printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:%s\n' "$priority" | sudo tee -a /etc/apt/apt-mirrors.txt
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ] && ! getent ahostsv4 security.ubuntu.com >/dev/null; then
              sudo sed -Ei 's#^(URIs: )https?://security\.ubuntu\.com/ubuntu/?$#\1mirror+file:/etc/apt/apt-mirrors.txt#' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get update
          fi
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev xclip

      - run: cargo fmt --all -- --check

      - run: ./build.sh

      - run: cargo test --locked --future-incompat-report

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate executable documentation
        run: |
          xvfb-run -a calcit calcit.cirru docs check-md README.md --failures-only
          xvfb-run -a calcit calcit.cirru docs check-md docs/system-clipboard.md --failures-only

      - name: Run clipboard integration test
        env:
          CALCIT_CLIPBOARD_TEST: 1
        run: xvfb-run -a sh -c 'printf %s ci-original | xclip -selection clipboard && calcit calcit.cirru'
