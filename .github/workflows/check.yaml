on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1

      - name: Validate Calcit snapshot and types
        run: |
          caps --ci
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --strict-types --check-only
          calcit calcit.cirru analyze quality
          calcit calcit.cirru analyze dynamic-methods --max 0
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
          calcit calcit.cirru docs format-md README.md --check

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev

      - run: cargo fmt --all -- --check

      - run: cargo build --release

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: mkdir -p dylibs/ && cp -v target/release/libclipboard.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate executable documentation
        run: |
          xvfb-run -a calcit calcit.cirru docs check-md README.md --failures-only
          xvfb-run -a calcit calcit.cirru docs check-md docs/system-clipboard.md --failures-only

      - run: xvfb-run -a calcit calcit.cirru
