on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v6
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --strict-types --check-only
          calcit calcit.cirru analyze quality
          calcit calcit.cirru analyze dynamic-methods
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
          calcit calcit.cirru docs format-md README.md --check

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev xclip

      - run: cargo fmt --all -- --check

      - run: cargo build --release

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: mkdir -p dylibs/ && cp -v target/release/libclipboard.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate executable documentation
        run: |
          xvfb-run -a calcit calcit.cirru docs check-md README.md --failures-only
          xvfb-run -a calcit calcit.cirru docs check-md docs/system-clipboard.md --failures-only

      - name: Run clipboard integration test
        env:
          CALCIT_CLIPBOARD_TEST: 1
        run: xvfb-run -a sh -c 'printf %s ci-original | xclip -selection clipboard && calcit calcit.cirru'
