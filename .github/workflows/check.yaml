on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: calcit-lang/setup-calcit@v1.3.0

      - name: Validate Calcit snapshot and types
        run: |
          caps --ci
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev

      - run: cargo build --release

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: mkdir -p dylibs/ && cp -v target/release/libclipboard.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - run: xvfb-run calcit calcit.cirru
