[package]
name = "clipboard"
version = "0.0.9"
authors = ["jiyinyiyong <jiyinyiyong@gmail.com>"]
edition = "2024"

[lib]
name = "clipboard"
path = "src/lib.rs"
crate-type = ["cdylib"] # Stable C ABI only; do not expose Rust dependency symbols.


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cirru_edn = "0.8"
cirru_parser = "0.2.4"
cli-clipboard = "0.4.0"
